name: Build and deploy scanfence.com

on:
  push:
    branches: [main]
  # Daily rebuild pulls fresh posts from the CMS, so WordPress edits go live
  # without a code push.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      refresh_cms:
        description: Fetch fresh content from cms.scanfence.com instead of the cache
        type: boolean
        default: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # CMS responses from the last build. Pushes build from this copy, so a
      # slow or blocking cms.scanfence.com can't fail a code deploy.
      - uses: actions/cache@v4
        with:
          path: .cms-cache
          key: cms-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cms-

      - name: Build Astro
        env:
          WP_API_URL: ${{ secrets.WP_API_URL }}
          CMS_CACHE: ${{ (github.event_name == 'schedule' || inputs.refresh_cms) && 'refresh' || 'offline' }}
        run: npm run build

      - name: Deploy dist/ to flokinet via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
